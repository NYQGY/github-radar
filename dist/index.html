<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>开源雷达 · 每周发现值得关注的项目</title><link rel="stylesheet" href="style.css"></head>
<body><header><a class="brand" href="./">◈ 开源雷达 <small>GITHUB RADAR</small></a><span class="edition">每周一期 · 持续观察</span></header><main><section class="hero"><div class="eyebrow">THE OPEN SOURCE EDIT</div><h1>好项目，<br>值得被发现<span>。</span></h1><p>追踪开源世界的变化，把值得关注的工具<br>留在你的下一次灵感里。</p><div class="stamp">OPEN<br>SOURCE<br><b>WEEKLY ↗</b></div></section><section class="stats"><div><b id="count">—</b><span>收录项目</span></div><div><b id="ready">—</b><span>具备七日观测</span></div><div><b id="date">—</b><span>最近采集 · 北京时间</span></div></section><nav><button class="active" data-view="all">项目库</button><button data-view="weekly">七日热榜</button><button data-view="archive">历史周报</button></nav><div class="filters"><input id="search" aria-label="搜索项目" placeholder="搜索项目、用途或标签…"><select id="language" aria-label="编程语言"><option value="">所有语言</option></select><select id="sort" aria-label="排序"><option value="stars">按总 Star</option><option value="delta">按七日净增长</option></select><select id="report" aria-label="周报日期" hidden></select></div><p id="note" class="note">正在加载真实 GitHub 数据…</p><section id="projects" class="grid" aria-live="polite"></section><footer><b>◈ 开源雷达</b><p>数据来自 GitHub API · 榜单仅覆盖已跟踪项目<br>七日净增长 = 当前 Star − 七日前快照；首次收录需等待完整观测周期。</p></footer></main><script src="app.js"></script></body></html>
